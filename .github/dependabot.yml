version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # Minor and patch updates are grouped. A major update arrives as its own pull request, so a
    # breaking one cannot block the safe updates next to it.
    groups:
      nest:
        patterns: ['@nestjs/*']
        update-types: ['minor', 'patch']
      dev-tooling:
        dependency-type: development
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'build(deps)'
