name: Release

# Keeps a release pull request up to date from the Conventional Commits on main. Merging it tags
# the release, updates CHANGELOG.md and bumps the version.
#
# The repository setting "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General) must be on, or this workflow cannot open the release PR.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
