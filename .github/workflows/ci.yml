name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run arch:check
      - run: npm run test:ci
      - name: Coverage by layer
        if: always()
        run: node scripts/coverage-summary.js >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      # Fails on a critical vulnerability. High ones are tracked: the remaining ones need a major
      # upgrade of NestJS and TypeORM (see the README). Tighten to --audit-level=high afterwards.
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  integration:
    name: Integration tests (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:integration

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The smoke test talks to the real MySQL and RabbitMQ of the compose file (the app itself
      # is started by the test, against a fake Telegram and a fake PCI Concursos).
      - name: Start MySQL and RabbitMQ
        run: docker compose up -d --wait mysql rabbitmq
      - run: npm run smoke
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 100

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-check:
    name: README or docs updated
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-docs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require docs changes when source changes
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -q '^src/' && ! echo "$changed" | grep -Eq '^(README\.md|CHANGELOG\.md|docs/)'; then
            echo "::error::src/ changed but README.md, CHANGELOG.md or docs/ did not. Update the progress board/docs, or add the 'no-docs' label for purely internal changes."
            exit 1
          fi
